name: sincere-required-ci

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sincere-required-ci:
    name: sincere-required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification code only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python version
        run: python3 --version
      - name: Syntax check
        run: python3 -m compileall -q sincere_ci tests
      - name: Synthetic preservation regression tests
        run: python3 -m unittest discover -s tests -v
